<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kan local-first breach defense</title>
  <desc id="desc">Cover image for the Kan Gemma 4 Good Hackathon submission.</desc>

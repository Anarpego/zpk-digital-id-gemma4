    <text x="40" y="224" font-family="Menlo, Consolas, monospace" font-size="26" fill="#0b3028">gemma_api(gemma-4-31b-it) -&gt; ok</text>
    <text x="40" y="272" font-family="Menlo, Consolas, monospace" font-size="26" fill="#0b3028">cactus local metrics -&gt; captured</text>
  </g>

